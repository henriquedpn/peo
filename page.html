<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PEO Auditoria</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f3f4f6;
}

.field-card{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:14px;
    margin-bottom:12px;
}

.field-card textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
}

.code-item{
    cursor:pointer;
    border:1px solid #ccc;
    padding:8px;
    border-radius:6px;
    background:white;
    transition:.2s;
}

.code-item:hover{
    background:#d8ebff;
}

.code-item.active{
    background:#0d6efd;
    color:white;
}

.codes-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;
}

.hidden{
    display:none;
}

</style>

</head>

<body>

<div class="container-fluid py-3">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h3>PEO Auditoria</h3>

        <button
            class="btn btn-secondary"
            onclick="toggleLanguage()">
            PT / EN
        </button>

    </div>

    <div class="card mb-3">
        <div class="card-body">

            <h5>Códigos do Requisito</h5>

            <div id="codesTable" class="codes-grid"></div>

        </div>
    </div>

    <div id="recordArea"></div>

</div>

<div id="errorBox"
     class="alert alert-danger m-3 hidden">
</div>

<script>

let DB = [];
let CURRENT = 0;
let LANG = "pt";
let LAYOUT = [];

const T = {

    pt: {
        agenda_base:"Agenda Base",
        agenda_sonda:"Agenda Sonda",
        codigo:"Código do Requisito",
        requisito:"Requisito",
        requisitominimo:"Requisito Mínimo",
        orientacoes:"Orientações",
        autoavaliacao:"Autoavaliação",
        autoavaliacaodt:"Autoavaliação Detalhada",
        auditado:"Auditado",
        apoio:"Apoio"
    },

    en: {
        agenda_base:"Base Schedule",
        agenda_sonda:"Rig Schedule",
        codigo:"Requirement Code",
        requisito:"Requirement",
        requisitominimo:"Minimum Requirement",
        orientacoes:"Guidelines",
        autoavaliacao:"Self Assessment",
        autoavaliacaodt:"Detailed Self Assessment",
        auditado:"Auditee",
        apoio:"Support"
    }

};

function showError(text){

    let el = document.getElementById("errorBox");

    el.innerText = text;

    el.classList.remove("hidden");

}

async function loadLayout(){

    try{

        const r = await fetch("layout.json");

        if(!r.ok){
            return;
        }

        const data = await r.json();

        LAYOUT = data.fields || [];

    }
    catch(e){

        console.warn(e);

    }
}

async function loadData(){

    try{

        const r = await fetch("db.json");

        if(!r.ok){
            throw new Error(
                "Unable to load db.json"
            );
        }

        const data = await r.json();

        DB = data.records || [];

        renderCodes();

        renderRecord();

    }
    catch(e){

        showError(e.message);

    }
}

function getFieldOrder(record){

    const fields = Object.keys(record);

    if(!LAYOUT.length){
        return fields;
    }

    let ordered = [];

    LAYOUT.forEach(l=>{

        if(fields.includes(l.field)){
            ordered.push(l.field);
        }

    });

    fields.forEach(f=>{

        if(!ordered.includes(f)){
            ordered.push(f);
        }

    });

    return ordered;

}

function renderCodes(){

    const el =
        document.getElementById(
            "codesTable"
        );

    let html = "";

    DB.forEach((record,index)=>{

        html += `
        <div
            class="code-item ${CURRENT===index ? 'active':''}"
            onclick="gotoRecord(${index})">
            ${record.codigo || ('Registro '+(index+1))}
        </div>
        `;

    });

    el.innerHTML = html;

}

function gotoRecord(index){

    CURRENT = index;

    renderCodes();

    renderRecord();

}

function toggleLanguage(){

    LANG =
        LANG === "pt"
        ? "en"
        : "pt";

    renderRecord();

}

function renderRecord(){

    if(!DB.length){

        document.getElementById(
            "recordArea"
        ).innerHTML =
            `
            <div class="alert alert-warning">
                Nenhum registro carregado
            </div>
            `;

        return;

    }

    let record = DB[CURRENT];

    let fields =
        getFieldOrder(record);

    let html = "";

    fields.forEach(field=>{

        html += `
        <div class="field-card">

            <strong>
                ${T[LANG][field] || field}
            </strong>

            <textarea readonly>
${record[field] || ""}
            </textarea>

        </div>
        `;

    });

    document.getElementById(
        "recordArea"
    ).innerHTML = html;

}

window.addEventListener(
    "error",
    function(e){

        showError(
            e.message
        );

    }
);

window.addEventListener(
    "DOMContentLoaded",
    async ()=>{

        await loadLayout();

        await loadData();

    }
);

</script>

</body>
</html>

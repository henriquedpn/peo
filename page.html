<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PEO Auditoria</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/gridstack@10.1.1/dist/gridstack.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>

body{
    background:#f4f4f4;
}

.field-card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    cursor:move;

}

.field-card.dragging{
    opacity:.5;
}

.field-card.drag-over{
    border:2px dashed #0d6efd;
}

.edit-icon{
    cursor:pointer;
}

.field-label{
    cursor:move;
}

.table-fixed{
    max-height:250px;
    overflow:auto;
}

#progressModal,
#errorModal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    display:none;
    z-index:99999;
}

.popup-box{
    background:white;
    width:600px;
    max-width:95%;
    margin:100px auto;
    padding:20px;
    border-radius:10px;
}

#recordArea{
    min-height:400px;
}

.grid-stack{
    max-height:800px;
}

.grid-stack-item-content{
    background:transparent;
    border: none;
    box-shadow: none;
    padding:0;
}

.field-card{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.field-card textarea{
    flex:1;
    resize:none;
    min-height:100px;
}

.codes-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:8px;
}

.code-item{
    background:#fff;
    border:1px solid #dee2e6;
    border-radius:8px;
    padding:10px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.code-item:hover{
    background:#a5cef8;
}

/* .code-item.dragging{
    opacity:.5;
} */

/* .code-item.drag-over{
    border:2px dashed #0d6efd;
} */

.card-body{
    overflow: hidden;
}

.grid-stack-item-content{
    overflow-y:hidden !important;
}

.ui-resizable-se,
.ui-resizable-sw,
.ui-resizable-s {
    opacity: 0 !important;
}

</style>

</head>

<body>

<div class="container-fluid mt-3">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h3 class="mb-0">
            PEO Auditoria
        </h3>

        <div>

            <input
                type="file"
                id="excelFile"
                accept=".xlsx,.xls"
                hidden
            >

            <button
                class="btn btn-primary"
                onclick="document.getElementById('excelFile').click()"
            >
                Importar Excel
            </button>

            <button
                class="btn btn-secondary"
                onclick="toggleLanguage()"
            >
                PT / EN
            </button>

        </div>

    </div>

    <div id="layoutAlert" class="alert alert-info">

        Arraste os campos para reorganizar o layout.
        A ordem será salva automaticamente em
        <strong>layout.json</strong>.

    </div>

    <div
        id="recordArea"
        class="grid-stack mb-4"
    >
    </div>


</div>

<div id="progressModal">

    <div class="popup-box">

        <h5>
            Convertendo Excel
        </h5>

        <div class="progress mt-3">

            <div
                id="progressBar"
                class="progress-bar progress-bar-striped progress-bar-animated"
                style="width:0%"
            >
                0%
            </div>

        </div>

    </div>

</div>

<div id="errorModal">

    <div class="popup-box">

        <h4 class="text-danger">
            Erro
        </h4>

        <pre
            id="errorText"
            style="
                white-space:pre-wrap;
                max-height:400px;
                overflow:auto;
            "
        ></pre>

        <button
            type="button"
            class="btn btn-danger"
            onclick="closeError()"
        >
            Fechar
        </button>

    </div>

</div>

<script>

window.onerror = function(
    message,
    source,
    lineno,
    colno,
    error
){

    try{

        let text =
            "Erro Javascript\n\n" +
            "Mensagem: " + message + "\n" +
            "Arquivo: " + source + "\n" +
            "Linha: " + lineno + "\n" +
            "Coluna: " + colno + "\n\n";

        if(error && error.stack){
            text += error.stack;
        }

        document.getElementById(
            "errorText"
        ).textContent = text;

        document.getElementById(
            "errorModal"
        ).style.display = "block";

    }
    catch(ex){

        alert(message);

    }

    return true;

};

window.addEventListener(
    "unhandledrejection",
    function(event){

        try{

            document.getElementById(
                "errorText"
            ).textContent =
                event.reason;

            document.getElementById(
                "errorModal"
            ).style.display = "block";

        }
        catch(ex){

            alert(event.reason);

        }

    }
);

</script>

<script src="setup.js"></script>

<script>

document
.getElementById(
    "excelFile"
)
.addEventListener(
    "change",
    uploadExcel
);

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        try{

            if(
                typeof loadLayout === "function"
            ){
                await loadLayout();
            }

            if(
                typeof loadData === "function"
            ){
                await loadData();
            }

        }
        catch(e){

            if(
                typeof showError === "function"
            ){
                showError(
                    e.stack || e
                );
            }

        }
    }
);

</script>


<script>
setTimeout(() => {

    const el =
        document.getElementById("layoutAlert");

    if (el) {

        const bsAlert =
            bootstrap.Alert.getOrCreateInstance(el);

        bsAlert.close();

    }

}, 5000);
</script>

<script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.1/dist/gridstack-all.js"></script>

</body>
</html>
